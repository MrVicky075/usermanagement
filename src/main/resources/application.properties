spring.application.name=user-management
server.port=8080

# MY-SQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_usermanagement?useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Configuration
#spring.datasource.url=jdbc:sqlserver://192.168.100.55:1440;databaseName=vs_user_management;encrypt=true;trustServerCertificate=true
#spring.datasource.username=PTDev
#spring.datasource.password=PTDev
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

# SESSION
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ERROR
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never