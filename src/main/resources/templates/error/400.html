<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Request · TaskFlow</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1120 0%, #1a2639 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(90, 140, 255, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(90, 140, 255, 0.03) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-30px, -20px) rotate(1deg); }
            66% { transform: translate(30px, 20px) rotate(-1deg); }
        }

        .error-container {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 32px;
            padding: 50px 40px 45px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .error-container:hover {
            transform: translateY(-4px);
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Status code */
        .status-code {
            position: relative;
            display: inline-block;
            font-size: 100px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24, #ff6b6b);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient-shift 3s ease-in-out infinite;
            margin-bottom: 10px;
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .status-code::after {
            content: '400';
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.1;
            filter: blur(20px);
            -webkit-text-fill-color: #ff6b6b;
            transform: scale(1.1);
            pointer-events: none;
        }

        /* Icon */
        .error-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: rgba(255, 107, 107, 0.15);
            border-radius: 50%;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 107, 107, 0.2);
            position: relative;
        }

        .error-icon i {
            font-size: 36px;
            color: #ff6b6b;
        }

        .error-icon .pulse {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(255, 107, 107, 0.2);
            animation: pulse-ring 2s ease-out infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* Content */
        .error-title {
            font-size: 28px;
            font-weight: 700;
            color: #f0f4ff;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .error-subtitle {
            font-size: 16px;
            color: rgba(200, 215, 255, 0.6);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .error-message {
            background: rgba(255, 107, 107, 0.08);
            border: 1px solid rgba(255, 107, 107, 0.15);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 30px;
            color: rgba(255, 200, 200, 0.9);
            font-size: 14px;
            line-height: 1.5;
            font-weight: 400;
        }

        .error-message i {
            color: #ff6b6b;
            margin-right: 8px;
        }

        /* Action buttons */
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a7fe0, #2b5fb0);
            color: white;
            box-shadow: 0 8px 24px rgba(74, 127, 224, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(74, 127, 224, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(200, 215, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #f0f4ff;
            transform: translateY(-2px);
        }

        .btn-secondary:active {
            transform: translateY(0px);
        }

        /* Support text */
        .support-text {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            color: rgba(200, 215, 255, 0.3);
        }

        .support-text a {
            color: rgba(200, 215, 255, 0.5);
            text-decoration: none;
            transition: color 0.2s;
        }

        .support-text a:hover {
            color: rgba(200, 215, 255, 0.8);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .error-container {
                padding: 36px 24px 32px;
                border-radius: 24px;
            }

            .status-code {
                font-size: 72px;
            }

            .error-icon {
                width: 64px;
                height: 64px;
            }

            .error-icon i {
                font-size: 28px;
            }

            .error-title {
                font-size: 22px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 13px;
                width: 100%;
                justify-content: center;
            }

            .actions {
                flex-direction: column;
            }
        }

        @media (max-width: 380px) {
            .error-container {
                padding: 28px 16px 24px;
            }

            .status-code {
                font-size: 56px;
            }
        }
    </style>
</head>

<body>

<div class="error-container">
    <!-- Icon -->
    <div class="error-icon">
        <span class="pulse"></span>
        <i class="fas fa-exclamation-triangle"></i>
    </div>

    <!-- Status Code -->
    <div class="status-code">400</div>

    <!-- Title -->
    <h1 class="error-title">Bad Request</h1>
    <p class="error-subtitle">The server couldn't understand your request.</p>

    <!-- Error Message -->
    <div class="error-message" th:if="${message}">
        <i class="fas fa-info-circle"></i>
        <span th:text="${message}">Invalid request parameters or malformed syntax.</span>
    </div>
    <div class="error-message" th:unless="${message}">
        <i class="fas fa-info-circle"></i>
        Invalid request parameters or malformed syntax.
    </div>

    <!-- Actions -->
    <div class="actions">
        <a th:href="@{/dashboard}" class="btn btn-primary">
            <i class="fas fa-arrow-left"></i>
            Go to Dashboard
        </a>
        <a href="javascript:history.back()" class="btn btn-secondary">
            <i class="fas fa-undo-alt"></i>
            Go Back
        </a>
    </div>

    <!-- Support -->
    <div class="support-text">
        Need help? <a href="#">Contact Support</a>
    </div>
</div>

</body>
</html>
