<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password · TaskFlow</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2f6fc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .form-card {
            background: #ffffff;
            max-width: 580px;
            width: 100%;
            border-radius: 28px;
            padding: 2.5rem 2.8rem 2.8rem;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.15);
            border: 1px solid #e8edf5;
            transition: all 0.2s ease;
        }

        .form-card:hover {
            box-shadow: 0 24px 48px -12px rgba(0, 20, 40, 0.2);
        }

        .form-header {
            border-bottom: 1px solid #e6ecf5;
            padding-bottom: 1.2rem;
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-weight: 600;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            color: #0b1c34;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .form-header h2 i {
            color: #4a7fe0;
        }

        .form-header h2 small {
            font-size: 0.85rem;
            font-weight: 400;
            color: #5d7395;
            margin-left: 0.3rem;
        }

        .form-header .badge-user {
            background: #eef3fc;
            color: #1f3f6b;
            padding: 0.3rem 1.2rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            border: 1px solid #d1ddea;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }

        .form-header .badge-user i {
            font-size: 0.65rem;
            color: #6f8fc9;
        }

        /* Alert messages */
        .alert {
            padding: 1rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
        }

        .alert-success {
            background: #e3f9ec;
            border: 1px solid #b8edd0;
            color: #1a6e4b;
        }

        .alert-danger {
            background: #ffe9ec;
            border: 1px solid #ffd6db;
            color: #b13e4b;
        }

        .alert i {
            font-size: 1.1rem;
        }

        .alert .close-alert {
            margin-left: auto;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: inherit;
        }

        .alert .close-alert:hover {
            opacity: 1;
        }

        /* Field groups */
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
        }

        .field-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1f3452;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .field-group label .required {
            color: #c53e4b;
            font-weight: 700;
            margin-left: 2px;
        }

        .field-group label i {
            font-size: 0.7rem;
            color: #6f8fc9;
        }

        .password-input-wrapper {
            position: relative;
        }

        .field-group input {
            background: #fafcff;
            border: 1.5px solid #dae1ed;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #0a1e3c;
            transition: 0.2s;
            outline: none;
            width: 100%;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
            padding-right: 3rem;
        }

        .field-group input:focus {
            border-color: #4a7fe0;
            box-shadow: 0 0 0 4px rgba(74, 127, 224, 0.10);
            background: #ffffff;
        }

        .field-group input.error {
            border-color: #dc2626;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.08);
        }

        .field-group input:disabled {
            background: #f1f3f5;
            color: #6b7280;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .field-group input::placeholder {
            color: #97abc9;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .field-group .hint {
            font-size: 0.7rem;
            color: #6982a8;
            margin-top: 0.1rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .field-group .hint i {
            font-size: 0.6rem;
        }

        .field-group .hint.success {
            color: #1a6e4b;
        }

        .field-group .hint.error {
            color: #dc2626;
        }

        .field-group .error-message {
            font-size: 0.75rem;
            color: #dc2626;
            margin-top: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .field-group .error-message i {
            font-size: 0.65rem;
        }

        /* Toggle password button */
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #97abc9;
            cursor: pointer;
            transition: color 0.2s;
            font-size: 1rem;
            padding: 0.2rem;
        }

        .toggle-password:hover {
            color: #4a7fe0;
        }

        /* Password strength indicator */
        .password-strength {
            margin-top: 0.3rem;
            display: flex;
            gap: 0.3rem;
            align-items: center;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            gap: 0.2rem;
        }

        .strength-bar .bar {
            flex: 1;
            height: 100%;
            background: #e9ecef;
            border-radius: 4px;
            transition: background 0.3s ease;
        }

        .strength-bar .bar.active-weak {
            background: #dc2626;
        }

        .strength-bar .bar.active-medium {
            background: #f59e0b;
        }

        .strength-bar .bar.active-strong {
            background: #22c55e;
        }

        .strength-text {
            font-size: 0.7rem;
            color: #6b7280;
            min-width: 60px;
            text-align: right;
        }

        /* Buttons */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e6ecf5;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 0.7rem 2rem;
            border-radius: 60px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.25s ease;
            background: transparent;
            letter-spacing: 0.01em;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a7fe0, #3a6bc0);
            color: white;
            border-color: #4a7fe0;
            box-shadow: 0 4px 12px rgba(74, 127, 224, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 127, 224, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0px);
        }

        .btn-secondary {
            border-color: #ccd7e9;
            color: #2a436e;
            background: #f7faff;
        }

        .btn-secondary:hover {
            background: #edf4ff;
            border-color: #b0c4e2;
            transform: translateY(-2px);
        }

        .btn-secondary:active {
            transform: translateY(0px);
        }

        .btn i {
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .form-card {
                padding: 1.8rem 1.5rem 2rem;
                border-radius: 20px;
            }

            .form-header h2 {
                font-size: 1.3rem;
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .form-actions .btn {
                width: 100%;
                justify-content: center;
                padding: 0.7rem 1.5rem;
            }

            .field-group input {
                font-size: 0.85rem;
                padding: 0.65rem 0.85rem;
                padding-right: 2.8rem;
            }
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 1.2rem 1rem 1.5rem;
                border-radius: 16px;
            }

            .form-header h2 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

<div class="form-card">
    <!-- Header -->
    <div class="form-header">
        <h2>
            <i class="fas fa-key"></i>
            Change Password
        </h2>

    </div>

    <!-- Success/Error Messages -->
    <div th:if="${param.success}" class="alert alert-success">
        <i class="fas fa-check-circle"></i>
        <span>Password changed successfully!</span>
        <button type="button" class="close-alert" onclick="this.parentElement.style.display='none'">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        <i class="fas fa-exclamation-circle"></i>
        <span th:text="${errorMessage} ?: 'Invalid old password or password mismatch.'">
            Invalid old password or password mismatch.
        </span>
        <button type="button" class="close-alert" onclick="this.parentElement.style.display='none'">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- Form -->
    <form th:action="@{/users/change-password/{id}(id=${userId})}"
          th:object="${changePassword}"
          method="post"
          id="changePasswordForm"
          novalidate>

        <input type="hidden" th:field="*{mode}" /> </br>

        <!-- New Password -->
        <div class="field-group">
            <label>
                <i class="fas fa-lock"></i>
                New Password <span class="required">*</span>
            </label>
            <div class="password-input-wrapper">
                <input type="password"
                       th:field="*{newPassword}"
                       id="newPassword"
                       placeholder="Enter new password "
                       required />
                <button type="button" class="toggle-password" data-target="newPassword">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <span class="error-message" th:if="${#fields.hasErrors('newPassword')}">
                <i class="fas fa-exclamation-circle"></i>
                <span th:errors="*{newPassword}">Error message</span>
            </span>
        </div>

        <!-- Confirm Password -->
        <div class="field-group">
            <label>
                <i class="fas fa-lock"></i>
                Confirm Password <span class="required">*</span>
            </label>
            <div class="password-input-wrapper">
                <input type="password"
                       th:field="*{confirmPassword}"
                       id="confirmPassword"
                       placeholder="Re-enter new password"
                       required />
                <button type="button" class="toggle-password" data-target="confirmPassword">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <span class="hint" id="confirmHint">
                <i class="fas fa-info-circle"></i>
                Must match the new password
            </span>
            <span class="error-message" th:if="${#fields.hasErrors('confirmPassword')}">
                <i class="fas fa-exclamation-circle"></i>
                <span th:errors="*{confirmPassword}">Error message</span>
            </span>
        </div>

        <!-- Actions -->
        <div class="form-actions">
            <a th:href="@{/users}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i>
                Cancel
            </a>
            <button type="submit" class="btn btn-primary" id="submitBtn">
                <i class="fas fa-save"></i>
                Change Password
            </button>
        </div>
    </form>
</div>

<script>
    // Toggle password visibility
    document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', function() {
            const targetId = this.dataset.target;
            const input = document.getElementById(targetId);
            const icon = this.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    });

    // Confirm password validation
    const confirmPassword = document.getElementById('confirmPassword');
    const confirmHint = document.getElementById('confirmHint');

    function validateConfirmPassword() {
        const newPass = newPassword.value;
        const confirmPass = confirmPassword.value;

        if (confirmPass.length === 0) {
            confirmHint.innerHTML = '<i class="fas fa-info-circle"></i> Must match the new password';
            confirmHint.className = 'hint';
            return;
        }

        if (newPass === confirmPass) {
            confirmHint.innerHTML = '<i class="fas fa-check-circle"></i> Passwords match';
            confirmHint.className = 'hint success';
        } else {
            confirmHint.innerHTML = '<i class="fas fa-exclamation-circle"></i> Passwords do not match';
            confirmHint.className = 'hint error';
        }
    }

    confirmPassword.addEventListener('input', validateConfirmPassword);
    newPassword.addEventListener('input', validateConfirmPassword);

    // Form validation before submit
    document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;

        if (!newPass || !confirmPass) {
            e.preventDefault();
            alert('Please fill in all fields.');
            return false;
        }

        if (newPass !== confirmPass) {
            e.preventDefault();
            alert('New password and confirm password do not match.');
            return false;
        }

        return true;
    });

    // Close alert messages
    document.querySelectorAll('.close-alert').forEach(button => {
        button.addEventListener('click', function() {
            this.parentElement.style.display = 'none';
        });
    });
</script>

</body>
</html>
