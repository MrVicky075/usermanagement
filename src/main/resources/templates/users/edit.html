<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Edit User</title>

    <meta charset="UTF-8">

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

    <h2>Edit User</h2>

    <form th:action="@{/users/update/{id}(id=${user.userId})}"
          th:object="${user}"
          method="post">

        <input type="hidden"
               th:field="*{userId}">

        <div class="form-field">

            <label>User Name</label>

            <input type="text"
                   th:field="*{userName}">

        </div>

        <div class="form-field">

            <label>Email</label>

            <input type="email"
                   th:field="*{email}">

        </div>

        <div class="form-field">

            <label>Mobile No</label>

            <input type="text"
                   th:field="*{mobileNo}">

        </div>

        <div class="form-field">

            <label>Role</label>

            <select th:field="*{role}">

                <option value="ADMIN">
                    Admin
                </option>

                <option value="SR_DEVELOPER">
                    Sr. Developer
                </option>

                <option value="DEVELOPER">
                    Developer
                </option>

            </select>

        </div>

        <div class="form-field">

            <label>Status</label>

            <select th:field="*{isActive}">

                <option th:value="true">
                    Active
                </option>

                <option th:value="false">
                    Inactive
                </option>

            </select>

        </div>

        <button type="submit">
            Update
        </button>

    </form>

</div>

</body>

</html>
