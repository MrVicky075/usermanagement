<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management · TaskFlow</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f4f7fc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05), 0 4px 10px rgba(0, 0, 0, 0.02);
            padding: 1.8rem;
            max-width: 1400px;
            width: 100%;
            transition: all 0.2s;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #0b1a33;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title small {
            font-size: 0.875rem;
            font-weight: 400;
            color: #5e6f8d;
            margin-left: 0.5rem;
        }

        .card-title i {
            color: #4a7fe0;
        }

        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.5rem;
            background: linear-gradient(135deg, #4a7fe0, #3a6bc0);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(74, 127, 224, 0.25);
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(74, 127, 224, 0.35);
        }

        .btn-add i {
            font-size: 0.875rem;
        }

        /* ----- table wrapper ----- */
        .table-responsive {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid #e9edf4;
            background: #ffffff;
            max-height: 520px;
            overflow-y: auto;
            overflow-x: auto;
        }

        /* ----- table styling ----- */
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
            min-width: 1100px;
            table-layout: auto;
        }

        /* header */
        .table thead th {
            background: #f8faff;
            color: #1a2c4a;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 1rem 1rem;
            border-bottom: 2px solid #d7e0ec;
            text-align: left;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        /* body cells */
        .table tbody td {
            padding: 0.9rem 1rem;
            border-bottom: 1px solid #eef2f8;
            vertical-align: middle;
            color: #1e2f4a;
            background-color: #ffffff;
        }

        .table tbody tr:hover td {
            background-color: #fafcff;
        }

        /* Badge styling */
        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: capitalize;
            border: 1px solid transparent;
        }

        .badge-active {
            background: #e3f9ec;
            color: #1a6e4b;
            border-color: #b8edd0;
        }

        .badge-inactive {
            background: #ffe9ec;
            color: #b13e4b;
            border-color: #ffd6db;
        }

        /* Action buttons */
        .action-group {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            background: transparent;
        }

        .action-btn i {
            font-size: 0.7rem;
        }

        .action-btn-view {
            color: #4a7fe0;
            border-color: #d0dae9;
            background: #f2f6ff;
        }

        .action-btn-view:hover {
            background: #e5edff;
            border-color: #a7bde0;
            transform: translateY(-1px);
        }

        .action-btn-edit {
            color: #f59e0b;
            border-color: #fde68a;
            background: #fffbeb;
        }

        .action-btn-edit:hover {
            background: #fef3c7;
            border-color: #f59e0b;
            transform: translateY(-1px);
        }

        .action-btn-password {
            color: #8b5cf6;
            border-color: #c4b5fd;
            background: #f5f3ff;
        }

        .action-btn-password:hover {
            background: #ede9fe;
            border-color: #8b5cf6;
            transform: translateY(-1px);
        }

        .action-btn-status {
            color: #0ea5e9;
            border-color: #bae6fd;
            background: #f0f9ff;
        }

        .action-btn-status:hover {
            background: #e0f2fe;
            border-color: #0ea5e9;
            transform: translateY(-1px);
        }

        .action-btn-delete {
            color: #dc2626;
            border-color: #fecaca;
            background: #fef2f2;
        }

        .action-btn-delete:hover {
            background: #fecaca;
            border-color: #dc2626;
            transform: translateY(-1px);
        }

        /* Divider */
        .action-divider {
            color: #d0dae9;
            font-weight: 300;
        }

        /* Custom footer */
        .custom-footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #38507a;
            padding: 0.8rem 0.2rem 0 0.2rem;
            border-top: 1px solid #eef2f8;
            margin-top: 0.75rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .footer-actions {
            display: flex;
            gap: 0.5rem;
        }

        .footer-btn {
            padding: 0.3rem 1rem;
            border: 1px solid #d0dae9;
            border-radius: 6px;
            background: white;
            color: #1a2c4a;
            font-size: 0.75rem;
            cursor: default;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        .footer-btn:hover {
            background: #f8faff;
            border-color: #a7bde0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .card {
                padding: 1rem;
            }

            .card-header {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-add {
                justify-content: center;
            }

            .table thead th,
            .table tbody td {
                padding: 0.65rem 0.75rem;
                font-size: 0.75rem;
            }

            .table {
                min-width: 900px;
            }

            .action-btn {
                padding: 0.25rem 0.5rem;
                font-size: 0.65rem;
            }

            .custom-footer-info {
                flex-direction: column;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .card-title {
                font-size: 1.2rem;
            }

            .action-group {
                gap: 0.2rem;
            }

            .action-divider {
                display: none;
            }

            .action-btn {
                font-size: 0.6rem;
                padding: 0.2rem 0.4rem;
            }
        }
    </style>
</head>
<body>

<div class="card">
  <!-- Card Header -->
  <div class="card-header">
    <h4 class="card-title">
      <i class="fas fa-users"></i>
      User Management
      <small th:text="'· ' + ${#lists.size(users)} + ' users'">· 0 users</small>
    </h4>
    <a th:href="@{/users/add}" class="btn-add">
      <i class="fas fa-plus-circle"></i>
      Add User
    </a>
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Mobile</th>
        <th>Role</th>
        <th>Status</th>
        <th>Created On</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="user : ${users}">
        <td th:text="${user.userId}">1</td>
        <td th:text="${user.userName}">John Doe</td>
        <td th:text="${user.email}">john@example.com</td>
        <td th:text="${user.mobileNo}">+1234567890</td>
        <td>
                        <span class="badge" th:classappend="${user.role == 'ADMIN' ? 'badge-active' : 'badge-inactive'}"
                              th:text="${user.role}">USER</span>
        </td>
        <td>
                        <span th:if="${user.isActive}" class="badge badge-active">
                            <i class="fas fa-check-circle"></i> Active
                        </span>
          <span th:unless="${user.isActive}" class="badge badge-inactive">
                            <i class="fas fa-times-circle"></i> Inactive
                        </span>
        </td>
        <td th:text="${#temporals.format(user.createdOn, 'dd MMM yyyy')}">01 Jan 2024</td>
        <td>
          <div class="action-group">

            <!-- Edit -->
            <a th:href="@{/users/edit/{id}(id=${user.userId})}" class="action-btn action-btn-edit" title="Edit User">
              <i class="fas fa-edit"></i> Edit
            </a>

            <span class="action-divider">|</span>

            <!-- Delete -->
            <form th:action="@{/users/delete/{id}(id=${user.userId})}"
                  method="post"
                  style="display:inline"
                  onsubmit="return confirm('Are you sure you want to delete this user?');">
              <button type="submit"
                      class="action-btn action-btn-delete"
                      title="Delete User">
                <i class="fas fa-trash-alt"></i> Delete
              </button>
            </form>

            <span class="action-divider">|</span>

            <!-- Toggle Status -->
            <form th:action="@{/users/status/{id}(id=${user.userId})}"
                  method="post"
                  style="display:inline">
              <button type="submit"
                      class="action-btn action-btn-status"
                      th:title="${user.isActive} ? 'Deactivate User' : 'Activate User'">
                <i class="fas" th:classappend="${user.isActive} ? 'fa-pause-circle' : 'fa-play-circle'"></i>
                <span th:text="${user.isActive} ? 'Inactive' : 'Active'"></span>
              </button>
            </form>

            <span class="action-divider">|</span>

            <!-- Change Password -->

            <a th:href="@{/users/change-password/{id}(id=${user.userId}, mode='admin')}"
               class="action-btn action-btn-password"
               title="Change Password for Admin">
              <i class="fas fa-key"></i> Password
            </a>

          </div>
        </td>
      </tr>
      <!-- Empty state -->
      <tr th:if="${#lists.isEmpty(users)}">
        <td colspan="8" style="text-align: center; padding: 3rem 1rem; color: #6b7280;">
          <i class="fas fa-users" style="font-size: 2rem; display: block; margin-bottom: 0.5rem; opacity: 0.3;"></i>
          No users found. Click "Add User" to create one.
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="custom-footer-info">
        <span>
            Showing <span th:text="${#lists.size(users)}">0</span> entries
        </span>
    <div class="footer-actions">
            <span class="footer-btn">
                <i class="fas fa-chevron-left"></i> Previous
            </span>
      <span class="footer-btn" style="background: #4a7fe0; color: white; border-color: #4a7fe0;">
                1
            </span>
      <span class="footer-btn">
                Next <i class="fas fa-chevron-right"></i>
            </span>
    </div>
  </div>
</div>

</body>
</html>
