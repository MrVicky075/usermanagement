<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>View User</title>

</head>

<body>

<div class="container">

    <h2>User Details</h2>

    <p>
        <strong>ID:</strong>
        <span th:text="${user.userId}"></span>
    </p>

    <p>
        <strong>Name:</strong>
        <span th:text="${user.userName}"></span>
    </p>

    <p>
        <strong>Email:</strong>
        <span th:text="${user.email}"></span>
    </p>

    <p>
        <strong>Mobile:</strong>
        <span th:text="${user.mobileNo}"></span>
    </p>

    <p>
        <strong>Role:</strong>
        <span th:text="${user.role}"></span>
    </p>

    <p>
        <strong>Status:</strong>
        <span th:if="${user.isActive}">
            Active
        </span>

        <span th:unless="${user.isActive}">
            Inactive
        </span>
    </p>

    <p>
        <strong>Created:</strong>
        <span th:text="${user.createdOn}"></span>
    </p>

    <p>
        <strong>Updated:</strong>
        <span th:text="${user.updatedOn}"></span>
    </p>

    <a th:href="@{/users}">
        Back
    </a>

</div>

</body>

</html>
