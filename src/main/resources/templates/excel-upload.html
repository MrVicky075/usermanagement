<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Excel Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
        .upload-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            background: #f9f9f9;
        }
        .upload-area {
            border: 2px dashed #007bff;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            background: #f0f8ff;
            border-color: #0056b3;
        }
        .upload-area.dragover {
            background: #e3f2fd;
            border-color: #0d6efd;
        }
        .file-input {
            display: none;
        }
        .preview-table {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .preview-table table {
            font-size: 13px;
        }
        .preview-table th {
            position: sticky;
            top: 0;
            background: #f8f9fa;
            z-index: 10;
            border-bottom: 2px solid #dee2e6;
        }
        .empty-value {
            color: #6c757d;
            font-style: italic;
            font-size: 12px;
        }
        .empty-value::before {
            content: "(empty)";
        }
        .stats-box {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
        }
        .upload-progress {
            display: none;
            margin-top: 15px;
        }
        .required-field {
            color: red;
            font-weight: bold;
        }
        .validation-error {
            background-color: #f8d7da !important;
        }
        .validation-success {
            background-color: #d4edda !important;
        }
    </style>
</head>
<body>
<div class="container">
  <div class="upload-container">
    <h2 class="text-center mb-4">
      <i class="fas fa-file-excel text-success"></i> Upload Excel Tasks
    </h2>

    <div class="alert alert-info">
      <i class="fas fa-info-circle"></i>
      <strong>Required Columns:</strong>
      <span class="required-field">Client Name</span>,
      <span class="required-field">Requirement</span>
      <br>
      <small>Blank cells will be displayed as "(empty)" and handled appropriately.</small>
    </div>

    <div class="text-end mb-3">
      <button class="btn btn-outline-primary btn-sm" onclick="downloadTemplate()">
        <i class="fas fa-download"></i> Download Template
      </button>
    </div>

    <div class="upload-area" id="uploadArea">
      <i class="fas fa-cloud-upload-alt" style="font-size: 48px; color: #007bff;"></i>
      <h4>Drop your Excel file here</h4>
      <p>or click to browse</p>
      <input type="file" class="file-input" id="fileInput" accept=".xlsx,.xls">
    </div>

    <div id="fileInfo" class="mt-3" style="display: none;">
      <div class="alert alert-success">
        <i class="fas fa-file-excel"></i>
        <strong>Selected File:</strong> <span id="fileName"></span>
        <button class="btn btn-sm btn-danger float-end" onclick="removeFile()">
          <i class="fas fa-times"></i> Remove
        </button>
      </div>
    </div>

    <div class="upload-progress" id="uploadProgress">
      <div class="progress">
        <div class="progress-bar progress-bar-striped progress-bar-animated"
             id="progressBar" style="width: 0%">0%</div>
      </div>
      <p class="text-center mt-2" id="progressText">Processing...</p>
    </div>

    <div id="previewSection" style="display: none;">
      <h5>Data Preview
        <span class="badge bg-secondary" id="totalRecords">0</span>
      </h5>
      <div class="stats-box">
        <div class="row">
          <div class="col-md-3">
            <small>Total Records: <strong id="totalRecordsCount">0</strong></small>
          </div>
          <div class="col-md-3">
            <small>Valid: <strong id="validRecords" class="text-success">0</strong></small>
          </div>
          <div class="col-md-3">
            <small>Invalid: <strong id="invalidRecords" class="text-danger">0</strong></small>
          </div>
          <div class="col-md-3">
            <small>Empty Cells: <strong id="emptyCells" class="text-warning">0</strong></small>
          </div>
        </div>
      </div>
      <div id="validationErrors"></div>
      <div class="preview-table" id="previewTable"></div>
      <div class="mt-3">
        <button class="btn btn-success" onclick="uploadExcel()" id="uploadBtn">
          <i class="fas fa-upload"></i> Upload Valid Tasks
        </button>
        <button class="btn btn-secondary" onclick="window.location.href='/dashboard'">
          <i class="fas fa-times"></i> Cancel
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
        let selectedFile = null;
        let parsedData = [];
        let fileData = [];
        let emptyCellCount = 0;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            const validTypes = ['application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                               'application/vnd.ms-excel'];
            if (!validTypes.includes(file.type) && !file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
                alert('Please upload a valid Excel file (.xlsx or .xls)');
                return;
            }

            selectedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileInfo').style.display = 'block';
            document.getElementById('previewSection').style.display = 'block';

            readExcel(file);
        }

        function readExcel(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];

                    // Get the data with proper header mapping
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, {
                        defval: null,  // Use null for empty cells
                        blankrows: true
                    });

                    // Clean up column names and handle empty cells
                    const cleanedData = jsonData.map(row => {
                        const cleanedRow = {};
                        Object.keys(row).forEach(key => {
                            // Get the clean column name
                            let cleanKey = key.trim();
                            // Handle special cases
                            if (cleanKey === 'Fixed On' || cleanKey === 'FixedOn') {
                                cleanKey = 'Fixed On';
                            }
                            // Get value, treat empty as null
                            let value = row[key];
                            if (value === undefined || value === null || value === '') {
                                value = null;
                            } else if (typeof value === 'string') {
                                value = value.trim();
                                if (value === '') value = null;
                            }
                            cleanedRow[cleanKey] = value;
                        });
                        return cleanedRow;
                    });

                    // Check for required columns
                    const expectedColumns = ['Assigned', 'Priority', 'Client Name', 'Issue', 'Redmine ID',
                                           'Days', 'Requirement', 'Task Details', 'Status', 'Fixed On', 'Remarks'];

                    if (cleanedData.length > 0) {
                        const actualColumns = Object.keys(cleanedData[0]);
                        const missingRequired = ['Client Name', 'Requirement'].filter(col => !actualColumns.includes(col));

                        if (missingRequired.length > 0) {
                            alert(`Missing required columns: ${missingRequired.join(', ')}`);
                            return;
                        }
                    }

                    fileData = cleanedData;
                    validateAndDisplayPreview(cleanedData);
                } catch (error) {
                    alert('Error reading Excel file: ' + error.message);
                    console.error(error);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function validateAndDisplayPreview(data) {
            parsedData = [];
            emptyCellCount = 0;
            let validCount = 0;
            let invalidCount = 0;
            const errors = [];

            data.forEach((row, index) => {
                const rowErrors = [];

                // Check required fields
                const clientName = row['Client Name'];
                const requirement = row['Requirement'];

                // Count empty cells in this row
                const emptyInRow = Object.values(row).filter(v => v === null || v === undefined).length;
                emptyCellCount += emptyInRow;

                if (!clientName || clientName.toString().trim() === '') {
                    rowErrors.push('Client Name is required');
                }
                if (!requirement || requirement.toString().trim() === '') {
                    rowErrors.push('Requirement is required');
                }

                if (rowErrors.length === 0) {
                    validCount++;
                    parsedData.push(row);
                } else {
                    invalidCount++;
                    errors.push(`Row ${index + 1}: ${rowErrors.join(', ')}`);
                }
            });

            document.getElementById('totalRecordsCount').textContent = data.length;
            document.getElementById('validRecords').textContent = validCount;
            document.getElementById('invalidRecords').textContent = invalidCount;
            document.getElementById('emptyCells').textContent = emptyCellCount;

            if (errors.length > 0) {
                const errorHtml = errors.map(err => `<li>${err}</li>`).join('');
                document.getElementById('validationErrors').innerHTML = `
                    <div class="alert alert-warning mt-2">
                        <strong><i class="fas fa-exclamation-triangle"></i> ${invalidCount} row(s) have validation errors:</strong>
                        <ul class="mb-0">${errorHtml}</ul>
                    </div>
                `;
            } else {
                document.getElementById('validationErrors').innerHTML = '';
            }

            displayPreview(data);
        }

        function displayPreview(data) {
            const table = document.getElementById('previewTable');
            if (data.length === 0) {
                table.innerHTML = '<p class="text-muted">No data found in Excel</p>';
                return;
            }

            // Show first 10 rows
            const previewData = data.slice(0, 10);
            let html = '<table class="table table-bordered table-striped table-sm">';

            // Headers with required field indicators
            html += '<thead><tr>';
            Object.keys(previewData[0]).forEach(key => {
                const isRequired = ['Client Name', 'Requirement'].includes(key);
                html += `<th>${key} ${isRequired ? '<span class="required-field">*</span>' : ''}</th>`;
            });
            html += '<th>Status</th></tr></thead>';

            // Body
            html += '<tbody>';
            previewData.forEach((row, index) => {
                const isValid = row['Client Name'] && row['Requirement'];
                const hasEmpty = Object.values(row).some(v => v === null || v === undefined);

                html += `<tr class="${isValid ? 'validation-success' : 'validation-error'}">`;

                Object.values(row).forEach(value => {
                    if (value === null || value === undefined || value === '') {
                        html += `<td><span class="empty-value"></span></td>`;
                    } else {
                        html += `<td>${value}</td>`;
                    }
                });

                html += `<td>${isValid ? '✅ Valid' : '❌ Invalid'}</td>`;
                html += '</tr>';
            });

            if (data.length > 10) {
                html += `<tr><td colspan="100%" class="text-center text-muted">... and ${data.length - 10} more rows</td></tr>`;
            }
            html += '</tbody></table>';
            table.innerHTML = html;

            // Update upload button state
            document.getElementById('uploadBtn').disabled = (parsedData.length === 0);
        }

        function removeFile() {
            selectedFile = null;
            parsedData = [];
            fileData = [];
            document.getElementById('fileInfo').style.display = 'none';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('fileInput').value = '';
            document.getElementById('uploadProgress').style.display = 'none';
        }

        function uploadExcel() {
            if (parsedData.length === 0) {
                alert('No valid data to upload. Please check your Excel file.');
                return;
            }

            const invalidRows = fileData.length - parsedData.length;
            let confirmMessage = `Upload ${parsedData.length} valid task(s)?`;
            if (invalidRows > 0) {
                confirmMessage = `${invalidRows} row(s) have validation errors and will be skipped.
                                 Upload ${parsedData.length} valid task(s)?`;
            }

            if (!confirm(confirmMessage)) {
                return;
            }

            // Show progress
            document.getElementById('uploadProgress').style.display = 'block';
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            progressBar.style.width = '0%';
            progressBar.textContent = '0%';

            // Send to backend
            fetch('/excel/upload-excel', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(parsedData)
            })
            .then(response => response.json())
            .then(data => {
                progressBar.style.width = '100%';
                progressBar.textContent = '100%';
                progressText.textContent = 'Upload complete!';

                if (data.success) {
                    let message = `✅ Successfully uploaded ${data.count} tasks!`;
                    if (data.skipped > 0) {
                        message += `\n⚠️ ${data.skipped} rows were skipped due to validation errors.`;
                    }
                    if (data.emptyCells > 0) {
                        message += `\nℹ️ ${data.emptyCells} empty cells were found and handled.`;
                    }
                    alert(message);
                    window.location.href = '/dashboard';
                } else {
                    alert('❌ Error uploading tasks: ' + data.message);
                }
            })
            .catch(error => {
                progressBar.classList.add('bg-danger');
                alert('❌ Error uploading tasks: ' + error.message);
            });
        }

        function downloadTemplate() {
            window.location.href = '/excel/download-template';
        }
    </script>
</body>
</html>
